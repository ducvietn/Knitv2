# KNIT — cấu hình deploy cho Render.
#
# Kiến trúc: Render Web Service (Docker) + Supabase Postgres.
#
# Render free KHÔNG có persistent disk, nên SQLite sẽ mất dữ liệu mỗi lần
# restart. Vì vậy production bắt buộc dùng Postgres:
#
#   KNIT_DB_DRIVER=postgres  +  DATABASE_URL=<chuoi ket noi Supabase>
#
# Khi đó `docker-entrypoint.sh` tự chạy migrate + seed trước khi khởi động
# server, nên container hoàn toàn stateless — deploy lại không mất dữ liệu.
#
# Lưu ý về mật khẩu: connection string chứa ký tự đặc biệt phải được
# URL-encode trong trường hợp. Ngoài ra nên đặt `DATABASE_URL` bằng
# "sync: false" để không ghi giá trị vào file blueprint.

services:
  - type: web
    name: knit
    runtime: docker
    repo: https://github.com/ducvietn/Knitv2
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # `PORT` do Render tu cap — khong gan cung trong blueprint de tranh
      # xung dot voi gia tri Render inject.
      # Driver Postgres — dùng `server/src/lib/sql.ts`.
      - key: KNIT_DB_DRIVER
        value: postgres
      # Chỗ chứa DB chỉ dùng cho chế độ SQLite (local dev).
      - key: KNIT_DB
        value: /data/knit.db
      # Avatar lưu trên Supabase Storage (stateless) khi có
      # SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY; nếu không thì fallback
      # về thư mục local (mất khi restart).
      - key: KNIT_AVATAR_DIR
        value: /data/avatars
      - key: KNIT_WEB_DIST
        value: /app/app/dist
      - key: KNIT_SEED
        value: /app/server/seed-data.json
      - key: KNIT_SECRET
        generateValue: true
      # ---- Supabase Postgres ----
      # Thay bằng chuỗi kết nối thật của bạn. Dùng POOLER (hỗ trợ cả IPv4
      # lẫn IPv6) chứ không dùng direct connection (chỉ có IPv6):
      #   postgresql://postgres.<PROJECT_REF>:<PASSWORD>@aws-<N>-<region>.pooler.supabase.com:5432/postgres
      #
      # ⚠️ `N` trong `aws-<N>-<region>` KHÔNG phải luôn là `0`. Lấy đúng
      # chuỗi bằng cách chạy `supabase link --project-ref <ref>` rồi đọc
      # file `supabase/.temp/pooler-url`.
      - key: DATABASE_URL
        sync: false
      # ---- Supabase Storage (avatar) ----
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
